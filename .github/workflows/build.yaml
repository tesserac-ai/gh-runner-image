---
name: Build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve versions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./versions.sh | tee versions.env
          {
            echo 'args<<EOF'
            cat versions.env
            echo 'EOF'
            sed -n 's/^RUNNER_VERSION=/runner=/p' versions.env
            echo "date=$(date -u +%Y%m%d)"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          load: true
          provenance: false
          build-args: ${{ steps.v.outputs.args }}
          tags: ${{ env.IMAGE }}:ci
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.runner }}
            org.opencontainers.image.created=${{ steps.v.outputs.created }}

      - name: Smoke test
        run: >-
          docker run --rm --privileged
          -v "$PWD/test/smoke.sh:/smoke.sh:ro"
          "$IMAGE:ci" bash /smoke.sh

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # the image the smoke test ran, not a second build
      - name: Push
        id: push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RUNNER: ${{ steps.v.outputs.runner }}
          DATE: ${{ steps.v.outputs.date }}
        run: |
          for t in latest "$RUNNER" "$RUNNER-$DATE"; do
            docker tag "$IMAGE:ci" "$IMAGE:$t"
            docker push -q "$IMAGE:$t"
          done
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:latest" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # github turns off a public repo's schedule after 60 days without a commit
  keepalive:
    name: Keepalive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Re-enable the schedule
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable build.yaml -R "$GITHUB_REPOSITORY"
